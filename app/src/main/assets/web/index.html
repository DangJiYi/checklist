<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<meta name="app-version" content="__APP_VERSION__">
<title>每日检查表</title>
<script>
/* 主题必须在首次绘制前定下来，否则会先闪一帧白底再变暗。
   所以这段内联在 head 里，不走外链脚本。 */
(function () {
  var mode = 'auto';
  try { mode = localStorage.getItem('cl.theme') || 'auto'; } catch (e) {}
  var dark = mode === 'dark';
  if (mode === 'auto') {
    dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<link rel="stylesheet" href="app.css?v=__APP_VERSION__">
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="api.js?v=__APP_VERSION__"></script>
<script src="ui.js?v=__APP_VERSION__"></script>
</body>
</html>
