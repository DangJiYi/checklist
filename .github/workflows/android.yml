name: android

# 每次推送到 main 都跑：单测 → 打包 → 校验 APK 内容 → 报体积 → 上传产物。
# 校验放在这里而不是放在本地手工步骤里，因为"打出一个白屏 APK 但构建全绿"
# 是最容易蒙混过去的一类故障。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 失败时要把编译日志推到 ci-log 分支，所以需要 contents: write。
    # 这是整个工作流唯一的写权限；工作流只在 push 到 main 时触发，
    # 推 ci-log 分支不会引起构建循环。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：ubuntu-latest 自带 Android SDK，
      # 再让一个第三方 action 去重装 cmdline-tools 只会多一个失败点。
      # 直接把已有 SDK 的路径找出来，缺什么装什么。
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # 只在本 step export 是没用的，后续 Gradle 步骤读不到，必须写进 GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "  (none)"
            echo "build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "  (none)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          SDKM=$(command -v sdkmanager || true)
          if [ -z "$SDKM" ]; then
            SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          fi
          if [ -z "$SDKM" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager: $SDKM" | tee -a "$GITHUB_STEP_SUMMARY"

          # SIGPIPE 会让 yes| 返回非零，别让许可证步骤把整个构建搞挂
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0"

      # 仓库里没有 gradle-wrapper.jar（二进制不便入库），所以由 CI 提供 Gradle。
      # 本地要构建的话：gradle assembleDebug，或先跑一次 gradle wrapper 生成 wrapper。
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests (StateMachine)
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest 2>&1 | tee gradle.log

      - name: Show build errors
        # 失败时把编译器的原话贴到 run 页面的 Summary 里。
        # GitHub 的原始日志下载需要鉴权，Summary 是免登录能看到的。
        if: failure()
        run: |
          {
            echo '## 失败输出'
            echo '```'
            tail -n 150 gradle.log 2>/dev/null || echo '(没有捕获到日志)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Frontend self-check
        # 在 Node 里把 api.js + ui.js 真实跑一遍，断言关键入口真的渲染出来了。
        # “点了没反应” 这类故障在真机上完全静默，在 CI 里却能当场拦住。
        run: node tools/webcheck.js

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee -a gradle.log

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          echo "--- assets ---"
          unzip -l "$APK" | grep -E 'assets/web/(index\.html|app\.css|api\.js|ui\.js)' || {
            echo "::error::APK 里缺少前端资源，打出来的会是白屏"
            exit 1
          }
          echo "--- dex ---"
          unzip -l "$APK" | grep -E 'classes.*\.dex' || {
            echo "::error::APK 里没有 dex"
            exit 1
          }
          echo "--- manifest ---"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml' || {
            echo "::error::APK 里没有 manifest"
            exit 1
          }

      - name: Report size
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BYTES=$(stat -c%s "$APK")
          HUMAN=$(printf '%.2f MB' "$(echo "$BYTES / 1048576" | bc -l)")
          echo "APK size: $BYTES bytes ($HUMAN)"
          echo "### APK 体积：$HUMAN（$BYTES bytes）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 这是 **debug** 包，未启用 R8，kotlin-stdlib 全量在内。" >> "$GITHUB_STEP_SUMMARY"
          echo "- 目标是 release + R8 后进入 1 MB 以内。" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BYTES" -gt 25165824 ]; then
            echo "::error::APK 超过 24 MB 上限（$HUMAN）"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: checklist-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # 失败时把编译器原文送到两个地方：
      #   1. Job Summary（免登录可见，着急时直接看）
      #   2. ci-log 分支（完整日志，供本地 git fetch 读取）
      # 放在最后一步，这样无论哪一步挂掉都能抓到，包括 assembleDebug。
      - name: Publish build log
        if: failure()
        run: |
          {
            echo "run: ${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f gradle.log ]; then
              echo "gradle.log: $(wc -l < gradle.log) lines"
              echo
              cat gradle.log
            else
              echo "(gradle.log 不存在：失败发生在 Gradle 之前)"
            fi
          } > ci-build.log

          {
            echo '## 失败输出'
            echo ''
            echo '```'
            tail -n 120 ci-build.log
            echo '```'
            echo ''
            echo '完整日志：`git fetch origin ci-log && git show FETCH_HEAD:build.log`'
          } >> "$GITHUB_STEP_SUMMARY"

          # 用 plumbing 提交，而不是新建临时仓库：
          # 这样能复用 checkout 已经配好的 origin 凭据，
          # 不必把 token 拼进 URL（git 报错时会把 URL 一起打出来，而这是公开仓库）。
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          BLOB=$(git hash-object -w ci-build.log)
          TREE=$(printf '100644 blob %s\tbuild.log\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "ci log for ${{ github.sha }}")
          # 强制覆盖：这条分支只存最近一次失败的日志，不需要历史
          git push -f -q origin "$COMMIT:refs/heads/ci-log"
          echo "日志已推到 ci-log 分支（$COMMIT）"

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
